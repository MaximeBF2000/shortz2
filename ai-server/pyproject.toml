[project]
name = "shortz-ai"
version = "0.1.0"
description = "Speech-to-text for Shortz, running on the Mac GPU with MLX."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "huggingface-hub>=2.4.0",
    "mlx-whisper>=0.4.3",
    "opencv-python-headless>=5.1.0.95",
    "pyobjc-framework-quartz>=13.0",
    "pyobjc-framework-vision>=13.0",
    "python-multipart>=0.0.34",
    "transcribe-cpp>=0.4.2",
    "transcribe-cpp-native>=0.4.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shortz-ai = "shortz_ai.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
