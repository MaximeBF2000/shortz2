[project]
name = "shortz-ai"
version = "0.1.0"
description = "Speech-to-text for Shortz, running on the Mac GPU with MLX."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "mlx-whisper>=0.4.3",
    "parakeet-mlx>=0.7.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shortz-ai = "shortz_ai.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
